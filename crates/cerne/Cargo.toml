[package]
name = "cerne"
description = "Event Storming building blocks for Domain-Driven Design in Rust"
version.workspace = true
documentation = "https://docs.rs/cerne"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.en.md"
keywords.workspace = true
categories = ["rust-patterns", "web-programming", "database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
axum = ["dep:axum"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "migrate"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
